eslogan: Moda mediterránea de lino, algodón y lana en el casco antiguo de Palma.
sector: moda
logo: ""          # ruta a una imagen en public/ (p. ej. /logo.svg). Vacío = nombre en texto.
colores:
  primario: "#121212"   # bandas oscuras, botones y textos fuertes
  acento: "#2b44d6"     # azul cobalto: bandas de color, etiquetas y líneas
  fondo: "#ffffff"
  texto: "#161616"
contacto:
  telefono: "971 72 48 19"
  email: hola@salilli.es
  direccion: "Carrer de Sant Miquel 41, 07002 Palma (Illes Balears)"
  horario: "Lunes a viernes de 10:00 a 14:00 y de 17:00 a 20:30. Sábados de 10:00 a 14:00."
  whatsapp: "+34 671 48 22 90"
redes:
  instagram: https://www.instagram.com/
  facebook: https://www.facebook.com/
  linkedin: ""
menu:
  - { texto: Colecciones, url: "/#colecciones" }
  - { texto: Novedades, url: "/#productos" }
  - { texto: Lookbook, url: "/#lookbook" }
