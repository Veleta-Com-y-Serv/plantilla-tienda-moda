  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de venir
    preguntas:
      - { pregunta: ¿Puedo reservar una prenda por WhatsApp?, respuesta: "Sí. Mándanos el nombre o la foto de la prenda y tu talla y te la guardamos 48 horas en la tienda." }
      - { pregunta: ¿Hacéis envíos?, respuesta: "Sí, a toda Mallorca en 24 horas y a la península en 48 a 72 horas. Pagas por transferencia o con un enlace de pago." }
      - { pregunta: ¿Cómo funcionan los cambios y devoluciones?, respuesta: "Tienes 30 días para cambiar o devolver la prenda con el ticket y sin usar. Las rebajas se cambian, pero no se devuelven." }
      - { pregunta: ¿Hacéis arreglos?, respuesta: "Sí. Los bajos y las mangas de las prendas de temporada son gratis y suelen estar el mismo día." }
      - { pregunta: ¿Tenéis tarjeta regalo?, respuesta: "Sí, del importe que quieras. Te la preparamos en la tienda o te la mandamos por WhatsApp." }

